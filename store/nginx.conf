# Digital Store - Nginx Configuration for aaPanel
# Copy this configuration to your site's Nginx config in aaPanel
#
# Usage:
# 1. Di aaPanel, buka Website > domain Anda > Config
# 2. Paste konfigurasi ini di bagian yang sesuai
# 3. Simpan dan restart Nginx

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Root directory - sesuaikan dengan path di aaPanel
    root /www/wwwroot/yourdomain.com;
    index index.php index.html;

    # Charset
    charset utf-8;

    # Max upload size
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block access to sensitive files
    location ~* \.(sql|log|env|md|json|lock)$ {
        deny all;
        return 404;
    }

    # Block access to includes and logs directory
    location ^~ /includes/ {
        deny all;
        return 404;
    }

    location ^~ /logs/ {
        deny all;
        return 404;
    }

    # Block PHP execution in uploads
    location ^~ /uploads/ {
        location ~* \.php$ {
            deny all;
            return 404;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Webhook endpoint - no rate limit
    location = /api/webhook-pakasir.php {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # API endpoints
    location ^~ /api/ {
        try_files $uri $uri/ =404;
        location ~* \.php$ {
            fastcgi_pass unix:/tmp/php-cgi-74.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 30;
        }
    }

    # Admin panel
    location ^~ /admin/ {
        try_files $uri $uri/ =404;
        location ~* \.php$ {
            fastcgi_pass unix:/tmp/php-cgi-74.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Error pages
    error_page 404 /pages/404.php;
    error_page 500 502 503 504 /pages/500.php;

    # Access & error logs
    access_log /www/wwwlogs/yourdomain.com.log;
    error_log /www/wwwlogs/yourdomain.com.error.log;
}
